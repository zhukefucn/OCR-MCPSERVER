server:
  host: 127.0.0.1
  port: 8000

auth:
  # Configure through OCR_AUTH__API_KEYS in production; empty means fail closed.
  api_keys: []

data_root: data

database:
  url: sqlite+aiosqlite:///data/ocr.sqlite3
  busy_timeout_ms: 5000
orchestration:
  worker_count: 1
  wake_queue_capacity: 64
  lease_seconds: 120
  heartbeat_seconds: 30
  idle_poll_seconds: 1
  recovery_scan_seconds: 30
  notification_min_interval_seconds: 2

health:
  probe_timeout_seconds: 3.0

limits:
  max_files: 20
  max_file_size_bytes: 31457280
  max_pages: 500
  max_batch_size_bytes: 1073741824

remote_import:
  allowed_hosts: []
  max_redirects: 3
  timeout_seconds: 30
  max_image_pixels: 100000000

retention:
  input_hours: 24
  intermediate_hours: 24
  result_hours: 24
  audit_metadata_days: 30
  cleanup_batch_size: 25
  cleanup_lease_seconds: 300
  cleanup_interval_seconds: 300

artifacts:
  max_artifact_bytes: 1073741824
  max_entry_bytes: 268435456
  max_entry_count: 20000
  max_markdown_bytes: 268435456

mineru:
  api_url: http://127.0.0.1:8001
  vlm_server_url: http://127.0.0.1:30000
  backend: vlm-http-client
  connect_timeout_seconds: 10
  read_timeout_seconds: 60
  write_timeout_seconds: 60
  pool_timeout_seconds: 10
  task_deadline_seconds: 900
  poll_interval_seconds: 1
  retry_attempts: 3
  retry_backoff_seconds: 0.5
  retry_max_backoff_seconds: 8
  max_compressed_bytes: 536870912
  max_uncompressed_bytes: 2147483648
  max_archive_entries: 10000

secondary_ocr:
  engine: pp_structure_v3
  device: cpu
  queue_capacity: 8
  classification_threshold: 0.8
  paddlex_config: null
  formula_model_name: PP-FormulaNet_plus-S
  orientation_model_dir: null
  orientation_model_name: PP-LCNet_x1_0_doc_ori
  orientation_assessment_timeout_seconds: 90
  orientation_assessment_lease_seconds: 100

structured_content:
  max_characters: 1000000
  max_utf8_bytes: 4000000
  max_html_depth: 64
  max_html_elements: 20000
  max_table_rows: 5000
  max_table_cells: 10000
  max_latex_repetition: 128
  max_artifact_bytes: 67108864

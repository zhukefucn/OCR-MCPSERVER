[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ocr-mcp-server"
version = "0.1.0"
description = "OCR MCP service skeleton"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115.6,<0.116",
  "fastmcp>=2.13.1,<3",
  "uvicorn>=0.35,<0.52",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<2.1",
  "aiosqlite>=0.20,<1",
  "httpx>=0.28,<0.29",
  "Pillow>=11,<12",
  "pypdf>=5,<6",
  "pypdfium2>=4.30,<5",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<0.26",
  "respx>=0.22,<0.23",
]

[project.scripts]
ocr-mcp-server = "ocr_mcp_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_mcp_server"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]
filterwarnings = [
  "error",
  "ignore:authlib\\.jose module is deprecated.*:authlib.deprecate.AuthlibDeprecationWarning",
]
